{{- if .Values.rbac.create -}}
# ClusterRole defining KubeZero RBAC permissions across the cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-zero.fullname" . }}-role
  labels:
    {{- include "kube-zero.labels" . | nindent 4 }}
rules:
  - apiGroups: ["finops.kubezero.io"]
    resources: ["zeropolicies", "zeropolicies/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]
{{- end }}
