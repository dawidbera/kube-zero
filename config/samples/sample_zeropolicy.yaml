# Sample ZeroPolicy configuring overnight sleep and wake-on-traffic for a development deployment
apiVersion: finops.kubezero.io/v1alpha1
kind: ZeroPolicy
metadata:
  name: payment-service-policy
  namespace: dev
spec:
  targetRef:
    kind: Deployment
    name: payment-service

  # Scheduled sleep windows: Mon-Fri 19:00 to 07:00, all weekend
  schedule:
    sleepCron: "0 19 * * 1-5"
    wakeCron: "0 7 * * 1-5"
    timezone: "UTC"

  # Dynamic scale-to-zero when no traffic received for 30 minutes
  inactivity:
    enabled: true
    idleTimeout: "30m"

  # Intercept HTTP requests when sleeping and wake workload transparently
  wakeOnTraffic:
    enabled: true
    servicePort: 8080
    targetPort: 8080
    readinessTimeout: "45s"
    maxBufferedBodyBytes: 10485760 # 10MB limit

  # AWS c6i instance equivalent pricing profile
  costProfile:
    hourlyCpuCoreCostUsd: 0.0416
    hourlyMemoryGbCostUsd: 0.0052
