# Kubernetes CustomResourceDefinition for KubeZero ZeroPolicy
# Group: finops.kubezero.io
# Purpose: Defines scheduled sleep/wake rules, inactivity thresholds, and Wake-on-Traffic settings for workloads.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zeropolicies.finops.kubezero.io
spec:
  group: finops.kubezero.io
  names:
    kind: ZeroPolicy
    listKind: ZeroPolicyList
    plural: zeropolicies
    singular: zeropolicy
    shortNames:
      - zp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: ZeroPolicy configures automated sleep and wake behavior for a target Kubernetes workload.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: Desired specification of the ZeroPolicy.
              required:
                - targetRef
              properties:
                targetRef:
                  type: object
                  description: Reference to the target Kubernetes deployment to manage.
                  required:
                    - kind
                    - name
                  properties:
                    apiVersion:
                      type: string
                      description: API version of target (default apps/v1).
                    kind:
                      type: string
                      description: Resource kind (currently Deployment).
                    name:
                      type: string
                      description: Name of the deployment within the policy namespace.
                schedule:
                  type: object
                  description: Cron-based sleep and wake schedule windows.
                  properties:
                    sleepCron:
                      type: string
                      description: Cron expression for when the workload should scale to 0.
                    wakeCron:
                      type: string
                      description: Cron expression for when the workload should restore target replicas.
                    timezone:
                      type: string
                      description: Standard IANA timezone (e.g. UTC, Europe/Warsaw).
                inactivity:
                  type: object
                  description: Dynamic inactivity threshold to scale down idle workloads.
                  properties:
                    enabled:
                      type: boolean
                      description: Whether inactivity scale-to-zero is enabled.
                    idleTimeout:
                      type: string
                      description: Inactivity duration before scaling down (e.g. 30m, 1h).
                wakeOnTraffic:
                  type: object
                  description: Wake-on-Traffic reverse proxy interceptor settings.
                  properties:
                    enabled:
                      type: boolean
                      description: Whether traffic hitting sleeping service triggers automatic wake-up.
                    servicePort:
                      type: integer
                      description: Port exposed on the Kubernetes Service.
                    targetPort:
                      type: integer
                      description: Port exposed by the workload container.
                    readinessTimeout:
                      type: string
                      description: Maximum duration to buffer requests while waiting for pod ready status.
                    maxBufferedBodyBytes:
                      type: integer
                      description: Maximum request body size buffered in memory (default 10MB).
                costProfile:
                  type: object
                  description: Pricing profile for estimating cost savings.
                  properties:
                    hourlyCpuCoreCostUsd:
                      type: number
                      description: Hourly cost per vCPU core in USD.
                    hourlyMemoryGbCostUsd:
                      type: number
                      description: Hourly cost per GB RAM in USD.
            status:
              type: object
              description: Observed status of the ZeroPolicy.
              properties:
                phase:
                  type: string
                  description: Current operational phase (Active, Sleeping, Waking, Failed).
                originalReplicas:
                  type: integer
                  description: Preserved replica count of target deployment prior to scale-to-zero.
                lastActivityTime:
                  type: string
                  format: date-time
                lastSleepTime:
                  type: string
                  format: date-time
                accumulatedSleepMinutes:
                  type: integer
                  description: Total minutes this workload has spent sleeping.
                totalSavedCostUsd:
                  type: number
                  description: Cumulative estimated USD savings from avoided compute usage.
