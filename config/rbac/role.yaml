# Kubernetes RBAC ClusterRole and Binding for KubeZero Operator
# Purpose: Grants least-privilege permissions required to scale deployments and update ZeroPolicy statuses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubezero-operator-role
rules:
  # Permissions to manage and observe custom ZeroPolicy resources
  - apiGroups: ["finops.kubezero.io"]
    resources: ["zeropolicies", "zeropolicies/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Permissions to inspect and scale managed workloads
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Read-only permissions to inspect pods and endpoints for readiness checks
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubezero-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubezero-operator-role
subjects:
  - kind: ServiceAccount
    name: kubezero-operator
    namespace: kubezero-system
