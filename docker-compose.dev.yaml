# Local development stack for KubeZero
# Runs the wake-proxy in mock mode alongside a sample upstream HTTP service and Prometheus.
version: "3.8"

services:
  # Mock upstream HTTP service simulating a business application
  sample-app:
    image: hashicorp/http-echo:latest
    command: ["-text", "Hello from behind KubeZero Wake-Proxy!"]
    ports:
      - "5678:5678"

  # KubeZero Wake-on-Traffic reverse proxy
  wake-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - "8080:8080" # Proxy entrypoint
      - "9090:9090" # Prometheus metrics & health probes
    environment:
      - MOCK_MODE=true
      - TARGET_URL=http://sample-app:5678
      - NAMESPACE=dev
      - DEPLOYMENT=sample-app
      - READINESS_TIMEOUT=30s
    depends_on:
      - sample-app

  # Prometheus scraper observing KubeZero FinOps savings & wake durations
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9092:9090"
    volumes:
      - ./config/prometheus.dev.yaml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - wake-proxy

  # Grafana dashboard visualizing FinOps savings & wake latency (http://localhost:3000)
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana-datasources.dev.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./config/grafana-dashboards.dev.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus
