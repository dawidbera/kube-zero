# Continuous Integration Workflow for KubeZero
# Runs tests with Go race detection, static code analysis (go vet), binary compilation, Helm chart linting,
# and full End-to-End (E2E) integration on an ephemeral k3d Kubernetes cluster.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Unit and Race Detection Tests
  test:
    name: Run Unit Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Set up Go runtime environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Execute static analysis (go vet)
        run: go vet ./...

      - name: Execute test suite with race detector
        run: go test -v -race ./...

  # Binary Compilation Verification
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Set up Go runtime environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Compile KubeZero controller and wake-proxy
        run: make build

  # Helm Chart Syntax and Validation
  helm-lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Set up Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Lint KubeZero Helm Chart
        run: helm lint charts/kube-zero

  # End-to-End Kubernetes Cluster Test
  e2e:
    name: Run E2E Integration on k3d
    runs-on: ubuntu-latest
    needs: [test, build, helm-lint]
    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Set up Go runtime environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Set up Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Install k3d CLI
        run: |
          wget -q -O - https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Execute E2E Test Suite on ephemeral k3d cluster
        run: make test-e2e
